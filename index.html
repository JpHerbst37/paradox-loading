<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ParadoxVRP</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css?family=Share+Tech+Mono|Barlow+Condensed:500,600,700" rel="stylesheet">
<style>
	html, body {
		margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
		background: #000; color: #dfe9ee;
		font-family: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
		-webkit-user-select: none; user-select: none; cursor: default;
	}

	#scene { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }

	.hud { position: absolute; text-shadow: 0 0 6px rgba(160, 220, 255, 0.35), 0 1px 2px rgba(0, 0, 0, 0.9); }

	.mono { font-family: "Share Tech Mono", "Consolas", "Courier New", monospace; letter-spacing: 0.06em; }

	/* top left: the recording */
	#rec { left: 4.2vw; top: 6.5vh; font-size: 2.3vh; }
	#rec .dot { display: inline-block; width: 1.5vh; height: 1.5vh; border-radius: 50%; background: #ff3b30;
		box-shadow: 0 0 8px #ff3b30; margin-right: 0.8vh; vertical-align: -0.1vh; }
	#rec .label { color: #ff6b5f; font-weight: 700; margin-right: 1.6vh; }
	#rec .sub { margin-top: 0.6vh; font-size: 1.6vh; color: #9fb4bd; }

	/* top right: battery and signal */
	#status { right: 4.2vw; top: 6.5vh; text-align: right; font-size: 1.7vh; }
	.row { margin-bottom: 0.9vh; white-space: nowrap; }
	.batt { display: inline-block; position: relative; width: 4.2vh; height: 1.9vh; border: 2px solid #dfe9ee;
		border-radius: 3px; vertical-align: middle; margin-left: 1vh; opacity: 0.9; }
	.batt:after { content: ""; position: absolute; right: -0.65vh; top: 0.45vh; width: 0.45vh; height: 0.8vh; background: #dfe9ee; border-radius: 0 2px 2px 0; }
	.batt .cell { position: absolute; left: 2px; top: 2px; bottom: 2px; width: 14%; background: #ff3b30; box-shadow: 0 0 6px #ff3b30; }
	.low { color: #ff6b5f; }
	.bars { display: inline-block; vertical-align: middle; margin-left: 1vh; height: 1.9vh; }
	.bars i { display: inline-block; width: 0.55vh; margin-left: 0.25vh; background: rgba(223, 233, 238, 0.22); vertical-align: bottom; }
	.bars i.on { background: #dfe9ee; }

	/* bottom left: where and how long */
	#days { left: 4.2vw; bottom: 17vh; }
	#days .big { font-size: 4.4vh; font-weight: 700; letter-spacing: 0.08em; line-height: 1; }
	#days .small { margin-top: 0.8vh; font-size: 1.7vh; color: #9fb4bd; }

	/* bottom: joining the server */
	#join { left: 4.2vw; right: 4.2vw; bottom: 5.5vh; }
	#join .top { font-size: 1.9vh; color: #9fb4bd; letter-spacing: 0.12em; }
	#join .top b { color: #ffffff; font-weight: 700; }
	#join .track { position: relative; margin-top: 1vh; height: 0.55vh; background: rgba(223, 233, 238, 0.15); overflow: hidden; }
	#join .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: #dfe9ee; box-shadow: 0 0 10px rgba(180, 230, 255, 0.8);
		-webkit-transition: width 0.4s; transition: width 0.4s; }
	#join .line { margin-top: 1vh; font-size: 1.6vh; color: #9fb4bd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	#join .line .pct { color: #ffffff; margin-right: 1.4vh; }
	#tip { margin-top: 1.2vh; font-size: 2vh; color: #dfe9ee; opacity: 0.92; -webkit-transition: opacity 0.6s; transition: opacity 0.6s; }
	#tip b { color: #ffb36b; font-weight: 700; margin-right: 0.8vh; letter-spacing: 0.1em; }

	/* bottom right: the music, in a recovered audio log window (YouTube's player, which must stay visible) */
	#audio { right: 4.2vw; bottom: 17vh; display: none; text-align: right; }
	#audio .cap { font-size: 1.5vh; color: #9fb4bd; margin-bottom: 0.6vh; letter-spacing: 0.14em; }
	#audio .frame { position: relative; width: 356px; height: 200px; margin-left: auto; background: rgba(0, 0, 0, 0.55);
		border: 1px solid rgba(223, 233, 238, 0.3); box-shadow: 0 0 18px rgba(0, 0, 0, 0.6); }
	#audio .frame:before, #audio .frame:after { content: ""; position: absolute; width: 14px; height: 14px; border-color: #dfe9ee; border-style: solid; }
	#audio .frame:before { left: -3px; top: -3px; border-width: 2px 0 0 2px; }
	#audio .frame:after { right: -3px; bottom: -3px; border-width: 0 2px 2px 0; }
	#audio .credit { margin-top: 0.6vh; font-size: 1.4vh; color: #9fb4bd; letter-spacing: 0.08em; }
	#audiohint { display: none; position: absolute; left: 0; top: 0; right: 0; bottom: 0; cursor: pointer; text-align: center;
		line-height: 200px; font-size: 1.8vh; color: #dfe9ee; background: rgba(0, 0, 0, 0.6); }

	.blink { -webkit-animation: blink 1.1s steps(2, start) infinite; animation: blink 1.1s steps(2, start) infinite; }
	@-webkit-keyframes blink { to { visibility: hidden; } }
	@keyframes blink { to { visibility: hidden; } }
</style>
<script src="config.js"></script>
<script src="scene.js"></script>
</head>
<body>

<canvas id="scene"></canvas>

<div id="rec" class="hud mono">
	<span class="dot blink"></span><span class="label">REC</span><span id="clock">22:47:13</span>
	<div class="sub" id="camid">CT-6116  //  HELMET CAM 02</div>
</div>

<div id="status" class="hud mono">
	<div class="row"><span class="low blink" id="battpct">BATT 06%</span><span class="batt"><span class="cell"></span></span></div>
	<div class="row"><span id="sigtext">SIGNAL WEAK</span><span class="bars" id="bars"><i style="height:30%"></i><i style="height:55%"></i><i style="height:78%"></i><i style="height:100%"></i></span></div>
</div>

<div id="days" class="hud">
	<div class="big mono" id="daysbig">DAY 214 STRANDED</div>
	<div class="small mono" id="where">WASSKAH  //  KASHYYYK SYSTEM</div>
</div>

<div id="audio" class="hud mono">
	<div class="cap">&#9834; AUDIO LOG  //  RECOVERED</div>
	<div class="frame"><div id="yt"></div><div id="audiohint">&#9654;  CLICK TO PLAY THE MUSIC</div></div>
	<div class="credit" id="credit"></div>
</div>

<div id="join" class="hud">
	<div class="top mono">UPLINK  //  JOINING <b id="server">PARADOXVRP</b>  <span id="mapinfo"></span></div>
	<div class="track"><div class="fill" id="fill"></div></div>
	<div class="line mono"><span class="pct" id="pct">0%</span><span id="statustext">ESTABLISHING CONNECTION...</span></div>
	<div id="tip"><b>TIP</b><span id="tiptext"></span></div>
</div>

<script>
	var CFG = window.LOADING || {};

	function $(id) { return document.getElementById(id); }

	function pad(n) { return (n < 10 ? "0" : "") + n; }

	/* ---------------------------------------------------------------- the camera's own readouts */

	var pageStart = new Date().getTime();

	var clockStart = 22 * 3600 + 47 * 60 + 13;

	function days() {
		if (CFG.FIXED_DAYS) return CFG.FIXED_DAYS;

		var s = CFG.STRANDED_SINCE || [2026, 3, 6];

		var since = new Date(s[0], s[1] - 1, s[2]).getTime();

		return Math.max(1, Math.floor((new Date().getTime() - since) / 86400000));
	}

	$("camid").innerHTML = (CFG.CLONE_ID || "CT-6116") + "  //  HELMET CAM 02";
	$("daysbig").innerHTML = "DAY " + days() + " STRANDED";
	$("where").innerHTML = CFG.LOCATION || "WASSKAH  //  KASHYYYK SYSTEM";
	$("server").innerHTML = (CFG.SERVER_NAME || "ParadoxVRP").toUpperCase();

	var battery = 6;

	setInterval(function () {
		var t = Math.floor((new Date().getTime() - pageStart) / 1000) + clockStart;

		$("clock").innerHTML = pad(Math.floor(t / 3600) % 24) + ":" + pad(Math.floor(t / 60) % 60) + ":" + pad(t % 60);

		/* the signal comes and goes */
		var strength = Math.random() < 0.18 ? 0 : 1;

		var bars = $("bars").getElementsByTagName("i");

		for (var i = 0; i < bars.length; i++) bars[i].className = (i < strength) ? "on" : "";

		$("sigtext").innerHTML = strength === 0 ? "NO SIGNAL" : "SIGNAL WEAK";
		$("sigtext").className = strength === 0 ? "low" : "";
	}, 1000);

	/* the battery dies very slowly */
	setInterval(function () {
		battery = Math.max(1, battery - 1);

		$("battpct").innerHTML = "BATT " + pad(battery) + "%";
	}, 240000);

	/* ---------------------------------------------------------------- tips */

	var tips = CFG.TIPS || [];
	var tipAt = Math.floor(Math.random() * Math.max(tips.length, 1));

	function nextTip() {
		if (!tips.length) return;

		var el = $("tip");

		el.style.opacity = 0;

		setTimeout(function () {
			tipAt = (tipAt + 1) % tips.length;

			$("tiptext").innerHTML = tips[tipAt];

			el.style.opacity = 0.92;
		}, 600);
	}

	if (tips.length) $("tiptext").innerHTML = tips[tipAt];

	setInterval(nextTip, 8000);

	/* ---------------------------------------------------------------- what Garry's Mod tells the page */

	/* ---------------------------------------------------------------- the music: YouTube's own player, shown */

	var musicOn = false, ytPlayer = null, ytVolume = 60;

	var musicVolume = (typeof CFG.MUSIC_VOLUME === "number") ? CFG.MUSIC_VOLUME : 0.6;

	function ytMake() {
		if (ytPlayer || !(window.YT && YT.Player)) return;

		/* somewhere random in the four hours, so nobody hears the same opening every time */
		var length = CFG.YOUTUBE_SECONDS || 14400;

		var start = Math.floor(Math.random() * Math.max(1, length - 900));

		ytPlayer = new YT.Player("yt", {
			width: 356, height: 200, videoId: CFG.YOUTUBE_ID,
			playerVars: { autoplay: 1, start: start, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, rel: 0, playsinline: 1,
				loop: 1, playlist: CFG.YOUTUBE_ID },
			events: {
				onReady: function (e) {
					e.target.setVolume(ytVolume);
					e.target.playVideo();
				},
				/* embedding turned off, or the video gone: the window goes, the page carries on silent */
				onError: function () { $("audio").style.display = "none"; }
			}
		});
	}

	window.onYouTubeIframeAPIReady = function () { if (musicOn) ytMake(); };

	function musicStart(volume) {
		if (CFG.MUSIC === false || !CFG.YOUTUBE_ID || musicOn) return;

		musicOn = true;

		ytVolume = Math.round(Math.max(0, Math.min(1, volume)) * 100);

		$("audio").style.display = "block";

		if (window.YT && YT.Player) {
			ytMake();
		} else {
			var tag = document.createElement("script");

			tag.src = "https://www.youtube.com/iframe_api";

			document.body.appendChild(tag);
		}

		/* a browser too old for YouTube: no window hanging there empty */
		setTimeout(function () { if (!ytPlayer) $("audio").style.display = "none"; }, 20000);
	}

	var filesTotal = 0, filesNeeded = 0, heard = false;

	function progress() {
		if (filesTotal <= 0) return;

		var done = Math.max(0, filesTotal - filesNeeded);

		var p = Math.max(0, Math.min(100, Math.floor(done / filesTotal * 100)));

		$("fill").style.width = p + "%";
		$("pct").innerHTML = p + "%";
	}

	window.GameDetails = function (servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language) {
		heard = true;

		if (servername) $("server").innerHTML = String(servername).toUpperCase();

		var bits = [];

		if (mapname) bits.push(String(mapname).toUpperCase());
		if (gamemode) bits.push(String(gamemode).toUpperCase());
		if (maxplayers) bits.push(maxplayers + " SLOTS");

		$("mapinfo").innerHTML = bits.length ? "&nbsp;//&nbsp; " + bits.join("&nbsp; // &nbsp;") : "";

		/* the music starts only in the game, never by itself in a browser */
		var v = (typeof volume === "number") ? Math.max(0, Math.min(1, volume)) : 1;

		musicStart(musicVolume * v);
	};

	window.SetFilesTotal = function (total) { heard = true; filesTotal = total; progress(); };

	window.SetFilesNeeded = function (needed) { heard = true; filesNeeded = needed; progress(); };

	window.DownloadingFile = function (fileName) {
		heard = true;

		$("statustext").innerHTML = "RECEIVING  " + String(fileName).replace(/^.*[\\\/]/, "").toUpperCase();
	};

	window.SetStatusChanged = function (status) {
		heard = true;

		$("statustext").innerHTML = String(status).toUpperCase();

		if (/sending client info|starting lua|lua/i.test(status)) {
			$("fill").style.width = "100%";
			$("pct").innerHTML = "100%";
		}
	};

	/* ---------------------------------------------------------------- start */

	Scene.start($("scene"));

	$("credit").innerHTML = CFG.YOUTUBE_CREDIT || "";

	/* opened in a normal browser, not the game: pretend to load, so it can be looked at -- silently */
	setTimeout(function () {
		if (heard) return;

		$("audio").style.display = "block";
		$("audiohint").style.display = "block";

		$("audiohint").onclick = function () {
			$("audiohint").style.display = "none";

			musicStart(musicVolume);
		};

		$("mapinfo").innerHTML = "&nbsp;//&nbsp; RP_NEVARRO &nbsp;//&nbsp; STARWARSRP &nbsp;//&nbsp; PREVIEW";

		var total = 412, need = 412;

		var names = ["models/joker/soldier/ct_soldier.mdl", "materials/niksacokica/republic/rep_wall_camera.vtf",
			"sound/lightsaber/saber_on1.wav", "maps/rp_nevarro.bsp", "lua/autorun/rphud_init.lua"];

		SetFilesTotal(total);

		var demo = setInterval(function () {
			need = Math.max(0, need - Math.floor(1 + Math.random() * 6));

			SetFilesNeeded(need);

			DownloadingFile(names[Math.floor(Math.random() * names.length)]);

			if (need <= 0) {
				clearInterval(demo);

				SetStatusChanged("Sending client info...");
			}
		}, 260);
	}, 3000);
</script>
</body>
</html>
